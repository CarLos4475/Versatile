name: versatile
description: "Gym workout tracker — bone white + claude orange liquid glass UI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: assets/icon/logo_versatile.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/logo_versatile.png
    - assets/assets/Piernas/
    - assets/assets/Torso/pecho/
    - assets/assets/Torso/espalda/
    - assets/assets/Torso/hombro/
    - assets/assets/Torso/core/
    - assets/assets/Torso/brazos/
